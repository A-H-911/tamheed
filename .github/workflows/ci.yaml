name: CI

# Deterministic, fail-closed gate for every push to main and every PR (plan 013/B10).
# Job 1 runs EXACTLY `python check.py` — the same one command contributors run
# locally, so "passes locally != passes CI" cannot happen. check.py owns the gate
# list (suites, structure lint, canonical form, eval-runner sample);
# anything deterministic goes there, never here. All checks are stdlib (D-U3).
# Two jobs sit outside check.py on purpose: `standup-browser` (plan 251, ADR-0005) and
# `slate-browser` (plan 257) open a page in the runner's Chrome, because only a browser can run
# a page's one script and lay out its text.
# Python floor is 3.10 per ASM-D (the MCP SDK's requires-python; 3.9 dropped —
# see CHANGELOG).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          # Plan 224 (R86): the lock's process probe has a macOS path of its own, and only a
          # real macOS run can test it. Two legs (the floor and the newest) keep the cost low.
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: The one command
        shell: bash
        run: python check.py

  standup-browser:
    # Plan 251 v2 (U4): the standup page runs one script, named by its hash. This job builds a
    # page from a temporary package and checks what the script and the styles DO: the filters,
    # the search, the colour switch, contrast, the phone width and print. Needs Node and a
    # browser, so it is not part of check.py. A missing Chrome fails the job (exit 2).
    name: Standup page in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build a page and check it in Chrome
        shell: bash
        run: |
          python tests/standup_browser_page.py "$RUNNER_TEMP/standup.html"
          node tests/run_standup_browser_check.mjs "$RUNNER_TEMP/standup.html" "$(command -v google-chrome)"

  slate-browser:
    # Plan 257 (R154): three of the field's defects were rendered ones: an intro that lost its
    # line breaks, a long word that pushed a card past a phone's width, and recommendations
    # hidden at open. A test of the page's text cannot see them. This job builds two interview
    # pages (one with `show_recommendations`, one without), checks what the script DOES, and
    # checks the layout at 390 px. A missing Chrome fails the job (exit 2).
    name: Slate page in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build two pages and check them in Chrome
        shell: bash
        run: |
          python tests/slate_browser_page.py "$RUNNER_TEMP/slate"
          for page in plain keyed; do
            node tests/run_slate_browser_check.mjs "$RUNNER_TEMP/slate/$page.html" "$(command -v google-chrome)"
          done

  server-smoke:
    # The uv/PEP 723 launch path is the documented install story — smoke it for real:
    # --selftest registers every tool with the SDK (plan 047) and exits 1 on failure.
    name: MCP server smoke (uv / PEP 723)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Server selftest via uv
        shell: bash
        run: uv run plugins/tamheed/server/tamheed_server.py --selftest

name: CI

# Deterministic, fail-closed gate for every push to main and every PR (plan 013/B10).
# Job 1 runs EXACTLY `python check.py` — the same one command contributors run
# locally, so "passes locally != passes CI" cannot happen. check.py owns the gate
# list (suites, structure lint, canonical form, eval-runner sample);
# anything deterministic goes there, never here. All checks are stdlib (D-U3).
# Python floor is 3.10 per ASM-D (the MCP SDK's requires-python; 3.9 dropped —
# see CHANGELOG).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: The one command
        shell: bash
        run: python check.py

  server-smoke:
    # The uv/PEP 723 launch path is the documented install story — smoke it for real:
    # --selftest registers every tool with the SDK (plan 047) and exits 1 on failure.
    name: MCP server smoke (uv / PEP 723)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Server selftest via uv
        shell: bash
        run: uv run plugins/tamheed/server/tamheed_server.py --selftest

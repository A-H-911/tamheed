    <rect x="590" y="178" width="210" height="14" rx="7" opacity=".55"/>
    <path d="M808 170 L840 185 L808 200 Z" fill="#a78bfa"/>
  </g>
  <text x="442" y="232" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="5" fill="#a78bfa">PLAN THE GROUND, KEEP THE RECORD</text>
</svg>

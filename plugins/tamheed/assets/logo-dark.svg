<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 52 842 200" width="842" height="200" role="img" aria-label="Tamheed">
  <title>Tamheed — تمهيد</title>
  <desc>The Tamheed logo (for dark backgrounds): the two-half paving mark (three ascending steps, a flat slab, an arc returning to the first step), the two-tone wordmark Tamheed beside the Arabic تمهيد on a shared baseline, a paved-path underline running into an arrow, and the tagline PLAN THE GROUND, KEEP THE RECORD.</desc>
  <rect x="44.0" y="127.0" width="32.0" height="18.0" rx="4.4" fill="#4c1d95"/>
  <rect x="74.0" y="101.0" width="32.0" height="18.0" rx="4.4" fill="#7c3aed"/>
  <rect x="104.0" y="75.0" width="32.0" height="18.0" rx="4.4" fill="#a78bfa"/>
  <rect x="142.0" y="78.0" width="40.0" height="12.0" rx="4.4" fill="#c4b5fd"/>
  <path d="M164.0 70.0 A66.0 66.0 0 0 0 60.0 113.0" fill="none" stroke="#a78bfa" stroke-width="5.60" stroke-linecap="round"/>
  <path d="M51.0 110.0 L69.0 110.0 L60.0 124.0 Z" fill="#a78bfa"/>
  <text x="196" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="92" font-weight="800"><tspan fill="#e0e7ff">Tam</tspan><tspan fill="#a78bfa">heed</tspan></text>
  <text x="840" y="142" text-anchor="end" font-family="'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', sans-serif" font-size="86" font-weight="700" fill="#a78bfa">تمهيد</text>
  <g fill="#4c1d95">
    <rect x="44"  y="178" width="150" height="14" rx="7"/>
    <rect x="206" y="178" width="180" height="14" rx="7" opacity=".85"/>

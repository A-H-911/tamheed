<svg class="dia" lang="ar" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="الوصفات التي تستدعي هذه الأداة، كل منها صف خطواتها. تُميَّز الخطوة التي يسمّي عنوانها الأداة." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:"Noto Naskh Arabic", "Segoe UI", Tahoma, serif;color:#efedf7;direction:rtl}text{fill:currentColor}.box{fill:#272435;stroke:#35324a;stroke-width:1.2}.box.acc{fill:#2a2545;stroke:#a78bfa}.box.good{fill:#23322e;stroke:#3fb950}.box.bad{fill:#38222d;stroke:#f85149}.box.warn{fill:#3a312c;stroke:#e3b341}.box.frame{fill:none;stroke:#35324a;stroke-dasharray:5 4}.frame .lbl{fill:#aba7c2}.edge{fill:none;stroke:#aba7c2;stroke-width:1.4}.edge.acc{stroke:#a78bfa;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#aba7c2;paint-order:stroke fill;stroke:#1e1c29;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#aba7c2}.arrow.acc{fill:#a78bfa}</style><defs><marker id="ar-seq-package_adopt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-seq-package_adopt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="76" rx="8"/><text class="lbl small" x="880.0" y="23.0" text-anchor="start" dominant-baseline="middle">تبنّي مستودع قائم</text></g><path class="edge  draw" marker-end="url(#ar-seq-package_adopt-ar)" d="M706.0 56.0 L698.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_adopt-ar)" d="M534.0 56.0 L526.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_adopt-ar)" d="M362.0 56.0 L354.0 56.0"/><path class="edge  draw" marker-
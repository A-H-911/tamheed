<svg class="dia" lang="en" viewBox="0 0 900 294" width="900" height="294" role="img" aria-label="The recipe by party, left to right: the operator&#x27;s lane, the agent&#x27;s, the engine&#x27;s." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#1b1a24;direction:ltr}text{fill:currentColor}.box{fill:#efedf7;stroke:#d9d6e6;stroke-width:1.2}.box.acc{fill:#ebe7fb;stroke:#5b3fd6}.box.good{fill:#e0efe6;stroke:#1f8a4c}.box.bad{fill:#f8e7e7;stroke:#c23b36}.box.warn{fill:#f3ebdd;stroke:#a8700f}.box.frame{fill:none;stroke:#d9d6e6;stroke-dasharray:5 4}.frame .lbl{fill:#5a5770}.edge{fill:none;stroke:#5a5770;stroke-width:1.4}.edge.acc{stroke:#5b3fd6;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#5a5770;paint-order:stroke fill;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#5a5770}.arrow.acc{fill:#5b3fd6}</style><defs><marker id="ar-wf-fully-auto-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-wf-fully-auto-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="86" rx="8"/><text class="lbl small" x="20.0" y="23.0" text-anchor="start" dominant-baseline="middle">Operator</text></g><g class="frame"><rect class="box frame" x="10.0" y="104" width="880" height="86" rx="8"/><text class="lbl small" x="20.0" y="117.0" text-anchor="start" dominant-baseline="middle">Agent (Claude Code)</text></g><g class="frame"><rect class="box frame" x="10.0" y="198" width="880" height="86" rx="8"/><text class="lbl small" x="20.0" y="211.0" text-anchor="start" dominant-baseline="middle">Engine (MCP server)</text></g><path class="edge  draw" marker-end="url(#ar-wf-fully-auto-en)" d="M194.0 62.0 L284.0 62.0 L284.0 134.0"/><path class="edge  draw" marker-end="url(#ar-wf-fully-auto-en)" d="M366.0 156.0 L456.0 156.0 L456.0 228.0"/><path class="edge  draw" marker-end="url(#ar-wf-fully-auto-en)" d="M538.0 250.0 L546.0 250.0"/><path class="edge  draw" marker-end="url(#ar-wf-fully-auto-en)" d="M710.0 250.0 L800.0 250.0 L800.0 84.0"/><g data-key="s1"><rect class="box acc" x="30.0" y="40" width="164" height="44" rx="6"/><text class="lbl " x="112.0" y="55.0" text-anchor="middle" dominant-baseline="middle">read loop-guard:</text><text class="lbl " x="112.0" y="69.0" text-anchor="middle" dominant-baseline="middle">the stop conditions</text></g><g data-key="s2"><rect class="box " x="202.0" y="134" width="164" height="44" rx="6"/><text class="lbl " x="284.0" y="149.0" text-anchor="middle" dominant-baseline="middle">loop-iteration,</text><text class="lbl " x="284.0" y="163.0" text-anchor="middle" dominant-baseline="middle">pass after pass</text></g><g data-key="s3"><rect class="box pill" x="374.0" y="228" width="164" height="44" rx="22.0"/><text class="lbl " x="456.0" y="243.0" text-anchor="middle" dominant-baseline="middle">the ITERATION: line,</text><text class="lbl " x="456.0" y="257.0" text-anchor="middle" dominant-baseline="middle">the harness decides</text></g><g data-key="s4"><rect class="box pill" x="546.0" y="228" width="164" height="44" rx="22.0"/><text class="lbl " x="628.0" y="243.0" text-anchor="middle" dominant-baseline="middle">a stop condition:</text><text class="lbl " x="628.0" y="257.0" text-anchor="middle" dominant-baseline="middle">escalation, halt</text></g><g data-key="s5"><rect class="box acc" x="718.0" y="40" width="164" height="44" rx="6"/><text class="lbl " x="800.0" y="55.0" text-anchor="middle" dominant-baseline="middle">resolve what stopped</text><text class="lbl " x="800.0" y="69.0" text-anchor=
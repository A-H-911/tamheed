<svg class="dia" lang="en" viewBox="0 0 790 260" width="790" height="260" role="img" aria-label="STD8, the standard set without the Review state. Approved moves to Implemented when verified. STD9 adds Review for slices and work items, drawn above." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#efedf7;direction:ltr}text{fill:currentColor}.box{fill:#272435;stroke:#35324a;stroke-width:1.2}.box.acc{fill:#2a2545;stroke:#a78bfa}.box.good{fill:#23322e;stroke:#3fb950}.box.bad{fill:#38222d;stroke:#f85149}.box.warn{fill:#3a312c;stroke:#e3b341}.box.frame{fill:none;stroke:#35324a;stroke-dasharray:5 4}.frame .lbl{fill:#aba7c2}.edge{fill:none;stroke:#aba7c2;stroke-width:1.4}.edge.acc{stroke:#a78bfa;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#aba7c2;paint-order:stroke fill;stroke:#1e1c29;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#aba7c2}.arrow.acc{fill:#a78bfa}</style><defs><marker id="ar-life-STD8-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-life-STD8-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><path class="edge  draw" marker-end="url(#ar-life-STD8-en)" d="M110.0 108.0 L150.0 108.0"/><path class="edge  draw" marker-end="url(#ar-life-STD8-en)" d="M250.0 108.0 L290.0 108.0"/><path class="edge acc draw" marker-end="url(#ara-life-STD8-en)" d="M400.0 108.0 L600.0 108.0"/><text class="lbl small" x="500.0" y="98.0" text-anchor="middle" dominant-baseline="middle">verified</text><path class="edge  draw" marker-end="url(#ar-life-STD8-en)" d="M200.0 90.0 L200.0 52.0"/><path class="edge  draw" marke
.0" text-anchor="middle" dominant-baseline="middle">gate_run passes,</text><text class="lbl small" x="383.5" y="234.0" text-anchor="middle" dominant-baseline="middle">advisories kept</text></g><g data-key="release-s4"><rect class="box pill" x="459.0" y="208" width="135" height="40" rx="20.0"/><text class="lbl small" x="526.5" y="222.0" text-anchor="middle" dominant-baseline="middle">work_bind the tag</text><text class="lbl small" x="526.5" y="234.0" text-anchor="middle" dominant-baseline="middle">to what it ships</text></g><g data-key="release-s5"><rect class="box pill" x="602.0" y="208" width="135" height="40" rx="20.0"/><text class="lbl small" x="669.5" y="222.0" text-anchor="middle" dominant-baseline="middle">export_html,</text><text class="lbl small" x="669.5" y="234.0" text-anchor="middle" dominant-baseline="middle">package_verify</text></g><g data-key="release-s6"><rect class="box pill" x="745.0" y="208" width="135" height="40" rx="20.0"/><text class="lbl small" x="812.5" y="222.0" text-anchor="middle" dominant-baseline="middle">close, commit,</text><text class="lbl small" x="812.5" y="234.0" text-anchor="middle" dominant-baseline="middle">go_no_go</text></g></svg>

<svg class="dia" lang="en" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="The recipes that call this tool, each as its row of steps. A step whose label names the tool is marked." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#efedf7;direction:ltr}text{fill:currentColor}.box{fill:#272435;stroke:#35324a;stroke-width:1.2}.box.acc{fill:#2a2545;stroke:#a78bfa}.box.good{fill:#23322e;stroke:#3fb950}.box.bad{fill:#38222d;stroke:#f85149}.box.warn{fill:#3a312c;stroke:#e3b341}.box.frame{fill:none;stroke:#35324a;stroke-dasharray:5 4}.frame .lbl{fill:#aba7c2}.edge{fill:none;stroke:#aba7c2;stroke-width:1.4}.edge.acc{stroke:#a78bfa;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#aba7c2;paint-order:stroke fill;stroke:#1e1c29;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#aba7c2}.arrow.acc{fill:#a78bfa}</style><defs><marker id="ar-seq-package_unlock-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-seq-package_unlock-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="76" rx="8"/><text class="lbl small" x="20.0" y="23.0" text-anchor="start" dominant-baseline="middle">Recover a held lock</text></g><path class="edge  draw" marker-end="url(#ar-seq-package_unlock-en)" d="M230.0 56.0 L245.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_unlock-en)" d="M445.0 56.0 L460.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_unlock-en)" d="M660.0 56.0 L675.0 56.0"/><g data-key="lock-recovery-s1"><rect class="box pill" x="30.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="130.0" y="50.0" text-anchor="middle" dominant-baseline="middle">the refusal names the</text><text class="lbl small" x="130.0" y="62.0" text-anchor="middle" dominant-baseline="middle">holder and its state</text></g><g data-key="lock-recovery-s2"><rect class="box pill" x="245.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="345.0" y="50.0" text-anchor="middle" dominant-baseline="middle">alive: ask. unobservable:</text><text class="lbl small" x="345.0" y="62.0" text-anchor="middle" dominant-baseline="middle">never remove the lock</text></g><g data-key="lock-recovery-s3"><rect class="box pill acc" x="460.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="560.0" y="50.0" text-anchor="middle" dominant-baseline="middle">not-running: package_unlock</text><text class="lbl small" x="560.0" y="62.0" text-anchor="middle" dominant-baseline="middle">confirm=true</text></g><g data-key="lock-recovery-s4"><rect class="box pill" x="675.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="775.0" y="50.0" text-anchor="middle" dominant-baseline="middle">package_open</text><text class="lbl small" x="775.0" y="62.0" text-anchor="middle" dominant-baseline="middle">as usual</text></g></svg>

<svg class="dia" lang="en" viewBox="0 0 900 272" width="900" height="272" role="img" aria-label="The recipes that call this tool, each as its row of steps. A step whose label names the tool is marked." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#1b1a24;direction:ltr}text{fill:currentColor}.box{fill:#efedf7;stroke:#d9d6e6;stroke-width:1.2}.box.acc{fill:#ebe7fb;stroke:#5b3fd6}.box.good{fill:#e0efe6;stroke:#1f8a4c}.box.bad{fill:#f8e7e7;stroke:#c23b36}.box.warn{fill:#f3ebdd;stroke:#a8700f}.box.frame{fill:none;stroke:#d9d6e6;stroke-dasharray:5 4}.frame .lbl{fill:#5a5770}.edge{fill:none;stroke:#5a5770;stroke-width:1.4}.edge.acc{stroke:#5b3fd6;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#5a5770;paint-order:stroke fill;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#5a5770}.arrow.acc{fill:#5b3fd6}</style><defs><marker id="ar-seq-package_open-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-seq-package_open-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="76" rx="8"/><text class="lbl small" x="20.0" y="23.0" text-anchor="start" dominant-baseline="middle">Resume a package in a new session</text></g><g class="frame"><rect class="box frame" x="10.0" y="96" width="880" height="76" rx="8"/><text class="lbl small" x="20.0" y="109.0" text-anchor="start" dominant-baseline="middle">Migrate a v2/v3 package to v4</text></g><g class="frame"><rect class="box frame" x="10.0" y="182" width="880" height="76" rx="8"/><text class="lbl small" x="20.0" y="195.0" text-anchor="start" dominant-baseline="middle">Recover a held lock</text></g><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M230.0 56.0 L245.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M445.0 56.0 L460.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M660.0 56.0 L675.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M194.0 142.0 L202.0 142.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M366.0 142.0 L374.0 142.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M538.0 142.0 L546.0 142.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M710.0 142.0 L718.0 142.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M230.0 228.0 L245.0 228.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M445.0 228.0 L460.0 228.0"/><path class="edge  draw" marker-end="url(#ar-seq-package_open-en)" d="M660.0 228.0 L675.0 228.0"/><g data-key="resume-s1"><rect class="box pill" x="30.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="130.0" y="50.0" text-anchor="middle" dominant-baseline="middle">the hook prints the</text><text class="lbl small" x="130.0" y="62.0" text-anchor="middle" dominant-baseline="middle">resume block</text></g><g data-key="resume-s2"><rect class="box pill acc" x="245.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="345.0" y="50.0" text-anchor="middle" dominant-baseline="middle">/tamheed:orient-resume:</text><text class="lbl small" x="345.0" y="62.0" text-anchor="middle" dominant-baseline="middle">server_info, package_open</text></g><g data-key="resume-s3"><rect class="box pill" x="460.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="560.0" y="50.0" text-anchor="middle" dominant-baseline="middle">handoff-current: the</text><text class="lbl small" x="560.0" y="62.0" text-anchor="middle" dominant-baseline="middle">journal moved past it</text></g><g data-key="resume-s4"><rect class="box pill" x="675.0" y="36" width="200" height="40" rx="20.0"/><text class="lbl small" x="775.0" y="50.0" text-anchor="middle" dominant-baseline="middle">a planning session:</text><text class="lbl small" x="775.0" y="62.0" text-anchor="middle" dominant-baseline="middle">--mode resume</text></g><g data-key="migrate-s1"><rect class="box pill" x="30.0" y="122" width="164" height="40" rx="20.0"/><text class="lbl small" x="112.0" y="136.0" text-anchor="middle" dominant-baseline="middle">package_migrate:</text><text class="lbl small" x="112.0" y="148.0" text-anchor="middle" dominant-baseline="middle">the preview</text></g><g data-key="migrate-s2"><rect class="box pill" x="202.0" y="122" width="164" height="40" rx="20.0"/><text class="lbl small" x="284.0" y="136.0" text-anchor="middle" dominant-baseline="middle">back the package up</text><text class="lbl small" x="284.0" y="148.0" text-anchor="middle" dominant-baseline="middle">(a commit)</text></g><g data-key="migrate-s3"><rect class="box pill" x="374.0" y="122" width="164" height="40" rx="20.0"/><text class="lbl small" x="456.0" y="136.0" text-anchor="middle" dominant-baseline="middle">confirm=true: files</text><text class="lbl small" x="456.0" y="148.0" text-anchor="middle" dominant-baseline="middle">become rows</text></g><g data-key="migrate-s4"><rect class="box pill" x="546.0" y="122" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="136.0" text-anchor="middle" dominant-baseline="middle">open, then gate_run:</text><text class="lbl small" x="628.0" y="148.0" text-anchor="middle" dominant-baseline="middle">G-REL passes</text></g><g data-key="migrate-s5"><rect class="box pill" x="718.0" y="122" width="164" height="40" rx="20.0"/><text class="lbl small" x="800.0" y="136.0" text-anchor="middle" dominant-baseline="middle">a v4 store: the</text><text class="lbl small" x="800.0" y="148.0" text-anchor="middle" dominant-baseline="middle">registry sync</text></g><g data-key="lock-recovery-s1"><rect class="box pill" x="30.0" y="208" width="200" height="40" rx="20.0"/><text class="lbl small" x="130.0" y="222.0" text-anchor="middle" dominant-baseline="middle">the refusal names the</text><text class="lbl small" x="130.0" y="234.0" text-anchor="middle" dominant-baseline="middle">holder and its state</text></g><g data-key="lock-recovery-s2"><rect class="box pill" x="245.0" y="208" width="200" height="40" rx="20.0"/><text class="lbl small" x="345.0" y="222.0" text-anchor="middle" dominant-baseline="middle">alive: ask. unobservable:</text><text class="lbl small" x="345.0" y="234.0" text-anchor="middle" dominant-baseline="middle">never remove the lock</text></g><g data-key="lock-recovery-s3"><rect class="box pill" x="460.0" y="208" width="200" height="40" rx="20.0"/><text class="lbl small" x="560.0" y="222.0" text-anchor="middle" dominant-baseline="middle">not-running: package_unlock</text><text class="lbl small" x="560.0" y="234.0" text-anchor="middle" dominant-baseline="middle">confirm=true</text></g><g data-key="lock-recovery-s4"><rect class="box pill acc" x="675.0" y="208" width="200" height="40" rx="20.0"/><text class="lbl small" x="775.0" y="222.0" text-anchor="middle" dominant-baseline="middle">package_open</text><text class="lbl small" x="775.0" y="234.0" text-anchor="middle" dominant-baseline="middle">as usual</text></g></svg>

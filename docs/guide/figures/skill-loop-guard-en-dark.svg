<svg class="dia" lang="en" viewBox="0 0 900 68" width="900" height="68" role="img" aria-label="The tools the skill&#x27;s text names, in the order of first mention, and STOP where the text marks a ceremony stop in bold." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#efedf7;direction:ltr}text{fill:currentColor}.box{fill:#272435;stroke:#35324a;stroke-width:1.2}.box.acc{fill:#2a2545;stroke:#a78bfa}.box.good{fill:#23322e;stroke:#3fb950}.box.bad{fill:#38222d;stroke:#f85149}.box.warn{fill:#3a312c;stroke:#e3b341}.box.frame{fill:none;stroke:#35324a;stroke-dasharray:5 4}.frame .lbl{fill:#aba7c2}.edge{fill:none;stroke:#aba7c2;stroke-width:1.4}.edge.acc{stroke:#a78bfa;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#aba7c2;paint-order:stroke fill;stroke:#1e1c29;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#aba7c2}.arrow.acc{fill:#a78bfa}</style><defs><marker id="ar-skill-loop-guard-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-skill-loop-guard-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><path class="edge  draw" marker-end="url(#ar-skill-loop-guard-en)" d="M161.0 30.0 L173.0 30.0"/><path class="edge  draw" marker-end="url(#ar-skill-loop-guard-en)" d="M304.0 30.0 L316.0 30.0"/><path class="edge  draw" marker-end="url(#ar-skill-loop-guard-en)" d="M447.0 30.0 L459.0 30.0"/><g data-key="t0"><rect class="box pill" x="30.0" y="12" width="131" height="36" rx="18.0"/><text class="lbl num small" x="95.5" y="30.0" text-anchor="middle" dominant-baseline="middle" style="direction:ltr;unicode-bidi:isolate">
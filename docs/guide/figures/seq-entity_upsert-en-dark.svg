</text></g><g data-key="update-s3"><rect class="box pill" x="374.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="456.0" y="216.0" text-anchor="middle" dominant-baseline="middle">progress_update</text><text class="lbl small" x="456.0" y="228.0" text-anchor="middle" dominant-baseline="middle">audit_record</text><text class="lbl small" x="456.0" y="240.0" text-anchor="middle" dominant-baseline="middle">work_bind</text></g><g data-key="update-s4"><rect class="box pill" x="546.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="222.0" text-anchor="middle" dominant-baseline="middle">the decision first,</text><text class="lbl small" x="628.0" y="234.0" text-anchor="middle" dominant-baseline="middle">then the SC- row</text></g><g data-key="update-s5"><rect class="box pill" x="718.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="800.0" y="222.0" text-anchor="middle" dominant-baseline="middle">approve, then the</text><text class="lbl small" x="800.0" y="234.0" text-anchor="middle" dominant-baseline="middle">SC- is Merged</text></g><g data-key="skill-promote-s1"><rect class="box pill" x="30.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="112.0" y="308.0" text-anchor="middle" dominant-baseline="middle">skill-promote:</text><text class="lbl small" x="112.0" y="320.0" text-anchor="middle" dominant-baseline="middle">clusters, STOP</text></g><g data-key="skill-promote-s2"><rect class="box pill" x="202.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="284.0" y="308.0" text-anchor="middle" dominant-baseline="middle">the interview: name,</text><text class="lbl small" x="284.0" y="320.0" text-anchor="middle" dominant-baseline="middle">trigger, level</text></g><g data-key="skill-promote-s3"><rect class="box pill" x="374.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="456.0" y="308.0" text-anchor="middle" dominant-baseline="middle">SKILL.md written,</text><text class="lbl small" x="456.0" y="320.0" text-anchor="middle" dominant-baseline="middle">SKL- row, Promoted</text></g><g data-key="skill-promote-s4"><rect class="box pill" x="546.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="308.0" text-anchor="middle" dominant-baseline="middle">handoff_emit</text><text class="lbl small" x="628.0" y="320.0" text-anchor="middle" dominant-baseline="middle">re-renders the note</text></g><g data-key="skill-promote-s5"><rect class="box pill" x="718.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="800.0" y="308.0" text-anchor="middle" dominant-baseline="middle">retire a skill the</text><text class="lbl small" x="800.0" y="320.0" text-anchor="middle" dominant-baseline="middle">plugin absorbs</text></g></svg>

<svg class="dia" lang="ar" viewBox="0 0 620 138" width="620" height="138" role="img" aria-label="ما يقرأ هذه العائلة عند البوابة وفي الجاهزية. البوابات الآلية فوق جدولها، ثم قواعد الجاهزية التي تكون هي عمومها، مانعة أو تنبيهية." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:"Noto Naskh Arabic", "Segoe UI", Tahoma, serif;color:#1b1a24;direction:rtl}text{fill:currentColor}.box{fill:#efedf7;stroke:#d9d6e6;stroke-width:1.2}.box.acc{fill:#ebe7fb;stroke:#5b3fd6}.box.good{fill:#e0efe6;stroke:#1f8a4c}.box.bad{fill:#f8e7e7;stroke:#c23b36}.box.warn{fill:#f3ebdd;stroke:#a8700f}.box.frame{fill:none;stroke:#d9d6e6;stroke-dasharray:5 4}.frame .lbl{fill:#5a5770}.edge{fill:none;stroke:#5a5770;stroke-width:1.4}.edge.acc{stroke:#5b3fd6;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#5a5770;paint-order:stroke fill;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#5a5770}.arrow.acc{fill:#5b3fd6}</style><defs><marker id="ar-trace-deferred-work-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-trace-deferred-work-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="20.0" y="10" width="290" height="118" rx="8"/><text class="lbl small" x="300.0" y="23.0" text-anchor="start" dominant-baseline="middle">قواعد الجاهزية</text></g><path class="edge  draw" marker-end="url(#ar-trace-deferred-work-ar)" d="M400.0 62.0 L386.0 62.0 L386.0 58.0 L290.0 58.0"/><path class="edge  draw" marker-end="url(#ar-trace-deferred-work-ar)" d="M400.0 76.0 L394.0 76.0 L394.0 106.0 L290.0 106.0"/><g data-key="fam"><rect class="box a
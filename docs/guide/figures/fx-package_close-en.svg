<svg class="dia" lang="en" viewBox="0 0 900 186" width="900" height="186" role="img" aria-label="What the tool needs before it runs, what it reads, and what it writes. Every claim is pinned to a line of the server." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#1b1a24;direction:ltr}text{fill:currentColor}.box{fill:#efedf7;stroke:#d9d6e6;stroke-width:1.2}.box.acc{fill:#ebe7fb;stroke:#5b3fd6}.box.good{fill:#e0efe6;stroke:#1f8a4c}.box.bad{fill:#f8e7e7;stroke:#c23b36}.box.warn{fill:#f3ebdd;stroke:#a8700f}.box.frame{fill:none;stroke:#d9d6e6;stroke-dasharray:5 4}.frame .lbl{fill:#5a5770}.edge{fill:none;stroke:#5a5770;stroke-width:1.4}.edge.acc{stroke:#5b3fd6;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#5a5770;paint-order:stroke fill;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#5a5770}.arrow.acc{fill:#5b3fd6}</style><defs><marker id="ar-fx-package_close-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-fx-package_close-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="260" height="74" rx="8"/><text class="lbl small" x="20.0" y="23.0" text-anchor="start" dominant-baseline="middle">reads</text></g><g class="frame"><rect class="box frame" x="610.0" y="10" width="270" height="110" rx="8"/><text class="lbl small" x="620.0" y="23.0" text-anchor="start" dominant-baseline="middle">writes</text></g><g class="frame"><rect class="box frame" x="320.0" y="82" width="230" height="74" rx="8"/><text class="lbl small" x="330.0" y="95
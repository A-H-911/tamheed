02.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="284.0" y="222.0" text-anchor="middle" dominant-baseline="middle">the interview: name,</text><text class="lbl small" x="284.0" y="234.0" text-anchor="middle" dominant-baseline="middle">trigger, level</text></g><g data-key="skill-promote-s3"><rect class="box pill" x="374.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="456.0" y="222.0" text-anchor="middle" dominant-baseline="middle">SKILL.md written,</text><text class="lbl small" x="456.0" y="234.0" text-anchor="middle" dominant-baseline="middle">SKL- row, Promoted</text></g><g data-key="skill-promote-s4"><rect class="box pill acc" x="546.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="222.0" text-anchor="middle" dominant-baseline="middle">handoff_emit</text><text class="lbl small" x="628.0" y="234.0" text-anchor="middle" dominant-baseline="middle">re-renders the note</text></g><g data-key="skill-promote-s5"><rect class="box pill" x="718.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="800.0" y="222.0" text-anchor="middle" dominant-baseline="middle">retire a skill the</text><text class="lbl small" x="800.0" y="234.0" text-anchor="middle" dominant-baseline="middle">plugin absorbs</text></g></svg>

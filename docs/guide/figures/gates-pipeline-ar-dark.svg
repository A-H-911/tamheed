<svg class="dia" lang="ar" viewBox="0 0 900 184" width="900" height="184" role="img" aria-label="بوابات gate_run الآلية بالترتيب الذي يقيّمها به الخادم، وفوقها readiness_check طبقةً دلالية. هما استدعاءان منفصلان، فلا سهم يربطهما." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:"Noto Naskh Arabic", "Segoe UI", Tahoma, serif;color:#efedf7;direction:rtl}text{fill:currentColor}.box{fill:#272435;stroke:#35324a;stroke-width:1.2}.box.acc{fill:#2a2545;stroke:#a78bfa}.box.good{fill:#23322e;stroke:#3fb950}.box.bad{fill:#38222d;stroke:#f85149}.box.warn{fill:#3a312c;stroke:#e3b341}.box.frame{fill:none;stroke:#35324a;stroke-dasharray:5 4}.frame .lbl{fill:#aba7c2}.edge{fill:none;stroke:#aba7c2;stroke-width:1.4}.edge.acc{stroke:#a78bfa;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#aba7c2;paint-order:stroke fill;stroke:#1e1c29;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#aba7c2}.arrow.acc{fill:#a78bfa}</style><defs><marker id="ar-gates-pipeline-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-gates-pipeline-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="66" rx="8"/><text class="lbl small" x="880.0" y="23.0" text-anchor="start" dominant-baseline="middle">⁦readiness_check⁩، الطبقة الدلالية فوقها</text></g><g class="frame"><rect class="box frame" x="10.0" y="96" width="880" height="74" rx="8"/><text class="lbl small" x="880.0" y="109.0" text-anchor="start" dominant-baseline="middle">⁦gate_run⁩، بترتيب التقييم</text></g><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M775.0 140.0 L763.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M668.0 140.0 L656.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M561.0 140.0 L549.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M454.0 140.0 L442.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M347.0 140.0 L335.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M240.0 140.0 L228.0 140.0"/><path class="edge  draw" marker-end="url(#ar-gates-pipeline-ar)" d="M133.0 140.0 L121.0 140.0"/><g data-key="p0"><rect class="box pill" x="667.0" y="36" width="203" height="28" rx="14.0"/><text class="lbl small" x="768.5" y="50.0" text-anchor="middle" dominant-baseline="middle">القواعد المانعة</text></g><g data-key="p1"><rect class="box pill" x="452.0" y="36" width="203" height="28" rx="14.0"/><text class="lbl small" x="553.5" y="50.0" text-anchor="middle" dominant-baseline="middle">إعفاءات ⁦WVR-⁩، مُبلَّغة</text></g><g data-key="p2"><rect class="box pill" x="237.0" y="36" width="203" height="28" rx="14.0"/><text class="lbl small" x="338.5" y="50.0" text-anchor="middle" dominant-baseline="middle">قواعد الحيوية التنبيهية</text></g><g data-key="p3"><rect class="box pill" x="22.0" y="36" width="203" height="28" rx="14.0"/><text class="lbl small" x="123.5" y="50.0" text-anchor="middle" dominant-baseline="middle">بوابات التنفيذ ⁦human_required⁩</text></g><g data-key="g0"><rect class="box good pill" x="775.0" y="122" width="95" height="36" rx="18.0"/><text class="lbl num small" x="822.5" y="140.0" text-anchor="middle" dominant-baseline="middle" style="direction:ltr;unicode-bidi:isolate">⁦G-IDS⁩</text></g><g data-key="g1"><rect class="box good pill" x="668.0" y="122" width="95" height="36" rx="18.0"/><text class="lbl num small" x="715.5" y="140.0" text-anchor="middle" dominant-baseline="middle" style="direction:ltr;unicode-bidi:isolate">⁦G-DEC-STATUS⁩</text
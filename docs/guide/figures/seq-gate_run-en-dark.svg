-anchor="middle" dominant-baseline="middle">confirm=true on your</text><text class="lbl small" x="456.0" y="234.0" text-anchor="middle" dominant-baseline="middle">word: recorded</text></g><g data-key="adopt-s4"><rect class="box pill acc" x="546.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="222.0" text-anchor="middle" dominant-baseline="middle">gate_run, readiness:</text><text class="lbl small" x="628.0" y="234.0" text-anchor="middle" dominant-baseline="middle">the gap report</text></g><g data-key="adopt-s5"><rect class="box pill" x="718.0" y="208" width="164" height="40" rx="20.0"/><text class="lbl small" x="800.0" y="222.0" text-anchor="middle" dominant-baseline="middle">promote what you</text><text class="lbl small" x="800.0" y="234.0" text-anchor="middle" dominant-baseline="middle">confirm, then update</text></g><g data-key="migrate-s1"><rect class="box pill" x="30.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="112.0" y="308.0" text-anchor="middle" dominant-baseline="middle">package_migrate:</text><text class="lbl small" x="112.0" y="320.0" text-anchor="middle" dominant-baseline="middle">the preview</text></g><g data-key="migrate-s2"><rect class="box pill" x="202.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="284.0" y="308.0" text-anchor="middle" dominant-baseline="middle">back the package up</text><text class="lbl small" x="284.0" y="320.0" text-anchor="middle" dominant-baseline="middle">(a commit)</text></g><g data-key="migrate-s3"><rect class="box pill" x="374.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="456.0" y="308.0" text-anchor="middle" dominant-baseline="middle">confirm=true: files</text><text class="lbl small" x="456.0" y="320.0" text-anchor="middle" dominant-baseline="middle">become rows</text></g><g data-key="migrate-s4"><rect class="box pill acc" x="546.0" y="294" width="164" height="40" rx="20.0"/><text class="lbl small" x="628.0" y="
<svg class="dia" lang="en" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="The recipes that call this tool, each as its row of steps. A step whose label names the tool is marked." xmlns="http://www.w3.org/2000/svg"><style>svg{font-family:Georgia, "Times New Roman", serif;color:#1b1a24;direction:ltr}text{fill:currentColor}.box{fill:#efedf7;stroke:#d9d6e6;stroke-width:1.2}.box.acc{fill:#ebe7fb;stroke:#5b3fd6}.box.good{fill:#e0efe6;stroke:#1f8a4c}.box.bad{fill:#f8e7e7;stroke:#c23b36}.box.warn{fill:#f3ebdd;stroke:#a8700f}.box.frame{fill:none;stroke:#d9d6e6;stroke-dasharray:5 4}.frame .lbl{fill:#5a5770}.edge{fill:none;stroke:#5a5770;stroke-width:1.4}.edge.acc{stroke:#5b3fd6;stroke-width:1.8}.edge.loop{stroke-dasharray:4 3}.lbl{font-size:12px}.lbl.small{font-size:10.5px;fill:#5a5770;paint-order:stroke fill;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.lbl.strong{font-weight:600;font-size:13px}.num{font-family:Consolas, Menlo, monospace;font-size:11px;direction:ltr;unicode-bidi:isolate}.arrow{fill:#5a5770}.arrow.acc{fill:#5b3fd6}</style><defs><marker id="ar-seq-server_info-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker><marker id="ara-seq-server_info-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow acc"/></marker></defs><g class="frame"><rect class="box frame" x="10.0" y="10" width="880" height="76" rx="8"/><text class="lbl small" x="20.0" y="23.0" text-anchor="start" dominant-baseline="middle">Upgrade the plugin around a live package</text></g><path class="edge  draw" marker-end="url(#ar-seq-server_info-en)" d="M165.0 56.0 L173.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-server_info-en)" d="M308.0 56.0 L316.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-server_info-en)" d="M451.0 56.0 L459.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-server_info-en)" d="M594.0 56.0 L602.0 56.0"/><path class="edge  draw" marker-end="url(#ar-seq-server_info-en)" d="M737.0 56.0 L745.0 56.0"/><g data-key="upgrade-s1"><rect class="box pill" x="30.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="97.5" y="50.0" text-anchor="middle" dominant-baseline="middle">commit, close,</text><text class="lbl small" x="97.5" y="62.0" text-anchor="middle" dominant-baseline="middle">keep a baseline</text></g><g data-key="upgrade-s2"><rect class="box pill" x="173.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="240.5" y="50.0" text-anchor="middle" dominant-baseline="middle">update the plugin,</text><text class="lbl small" x="240.5" y="62.0" text-anchor="middle" dominant-baseline="middle">restart</text></g><g data-key="upgrade-s3"><rect class="box pill" x="316.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="383.5" y="50.0" text-anchor="middle" dominant-baseline="middle">package_migrate:</text><text class="lbl small" x="383.5" y="62.0" text-anchor="middle" dominant-baseline="middle">the registry sync</text></g><g data-key="upgrade-s4"><rect class="box pill" x="459.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="526.5" y="50.0" text-anchor="middle" dominant-baseline="middle">package_open,</text><text class="lbl small" x="526.5" y="62.0" text-anchor="middle" dominant-baseline="middle">gate_run, ready?</text></g><g data-key="upgrade-s5"><rect class="box pill" x="602.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="669.5" y="50.0" text-anchor="middle" dominant-baseline="middle">handoff_emit</text><text class="lbl small" x="669.5" y="62.0" text-anchor="middle" dominant-baseline="middle">refresh_stock=true</text></g><g data-key="upgrade-s6"><rect class="box pill" x="745.0" y="36" width="135" height="40" rx="20.0"/><text class="lbl small" x="812.5" y="44.0" text-anchor="middle" dominant-baseline="middle">export_html,</text><text class="lbl small" x="812.5" y="56.0" text-anchor="middle" dominant-baseline="middle">commit data/</text><text class="lbl small" x="812.5" y="68.0" text-anchor="middle" dominant-baseline="middle">and the page</text></g></svg>
